name: Daily Tide Data Refresh

on:
  schedule:
    - cron: '20 14 * * *'  # 매일 23:20 KST (GitHub cron 지연을 감안해 자정 전에 실행)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Refresh tide data
        run: python scripts/daily_refresh.py

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add _data/tide_spots.json _data/extended_spots.json
          if ! git diff --cached --quiet; then
            git commit -m "Daily tide data refresh $(date -u +%Y-%m-%d)"
            git push
          else
            echo "No data changes"
          fi
